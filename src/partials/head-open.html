<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="icon" type="image/png" sizes="512x512" href="assets/favicon-512.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/favicon-180.png">
  <link rel="stylesheet" href="colors_and_type.css">
  <script>
    (function () {
      function getSystemTheme() {
        if (window.matchMedia) {
          return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        } else {
          return 'dark';
        }
      }
      try {
        var saved = localStorage.getItem('lh-theme');
        var theme = saved || getSystemTheme();
        document.documentElement.setAttribute('data-theme', theme);
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
  <style>
    * { box-sizing: border-box; }

    html[data-theme="dark"] {
      --bg:               var(--ink-black);
      --bg-elevated:      #00222e;
      --bg-warm:          #1f160a;
      --bg-inverse:       var(--azure-mist);
      --fg:               var(--azure-mist);
      --fg-inverse:       var(--ink-black);
      --accent:           var(--tropical-teal);
      --accent-hover:     var(--neon-ice);
      --accent-press:     var(--teal);
      --accent-fg:        var(--ink-black);
      --border:           color-mix(in oklab, var(--azure-mist) 10%, transparent);
      --border-strong:    color-mix(in oklab, var(--azure-mist) 18%, transparent);
    }

    /* Light mode: white page, azure-mist elevated surfaces (matches terms.html) */
    html:not([data-theme="dark"]) {
      --bg: #ffffff;
      --bg-elevated: var(--azure-mist);
    }

    html {
      background: var(--bg);
      transition: background var(--dur-slow) var(--ease-out);
    }
    body {
      background: transparent;
      color: var(--fg);
      min-height: 100vh;
      position: relative;
      transition: color var(--dur-slow) var(--ease-out);
    }

    .bg-dots {
      position: absolute;
      top: 0;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-dots canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-dots { display: none; }
    }

    html {
      background-color: color-mix(in oklab, var(--teal) 6%, var(--bg));
      background-image: linear-gradient(
        to bottom,
        color-mix(in oklab, var(--teal) 12%, var(--bg)),
        var(--bg) 400px
      );
    }

    html[data-theme="dark"] {
      background-color: color-mix(in oklab, var(--tropical-teal) 6%, var(--ink-black));
      background-image: linear-gradient(
        to bottom,
        color-mix(in oklab, var(--tropical-teal) 6%, var(--ink-black)),
        var(--ink-black) 400px
      );
    }

    /* HEADER — subtle teal-tinted glass */
    .header {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 40px));
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow: hidden;
      border-radius: var(--radius-lg);
      background: color-mix(in oklab, color-mix(in oklab, var(--teal) 75%, var(--tropical-teal)) 20%, color-mix(in oklab, #ffffff 30%, transparent));
      color: var(--ink-black);
      backdrop-filter: blur(28px) saturate(180%);
      -webkit-backdrop-filter: blur(28px) saturate(180%);
      box-shadow: 0 1px 0 0 color-mix(in oklab, var(--tropical-teal) 25%, transparent) inset, 0 -1px 0 0 color-mix(in oklab, var(--dark-teal) 15%, transparent) inset;
      transition: background var(--dur-slow) var(--ease-out), color var(--dur-slow) var(--ease-out), box-shadow 400ms var(--ease-out), width 300ms var(--ease-out), top 300ms var(--ease-out);
      backface-visibility: hidden;
    }
    html[data-theme="dark"] .header {
      background: color-mix(in oklab, var(--dark-teal) 28%, transparent);
      color: var(--azure-mist);
      box-shadow: 0 1px 0 0 color-mix(in oklab, var(--tropical-teal) 45%, transparent) inset, 0 -1px 0 0 rgba(0, 0, 0, 0.65) inset;
    }
    .header--floating {
      top: 18px;
      width: min(780px, calc(100% - 28px));
      box-shadow: 0 4px 12px color-mix(in oklab, #000 6%, transparent), 0 10px 32px color-mix(in oklab, #000 9%, transparent), 0 1px 0 0 color-mix(in oklab, var(--tropical-teal) 28%, transparent) inset, 0 -1px 0 0 color-mix(in oklab, var(--dark-teal) 17%, transparent) inset;
    }
    html[data-theme="dark"] .header--floating {
      box-shadow: 0 4px 12px color-mix(in oklab, #000 10%, transparent), 0 10px 32px color-mix(in oklab, #000 15%, transparent), 0 1px 0 0 color-mix(in oklab, var(--tropical-teal) 50%, transparent) inset, 0 -1px 0 0 rgba(0, 0, 0, 0.75) inset;
    }
    .header__bar {
      height: var(--header-height);
      display: flex;
      align-items: center;
      padding: 0 20px;
      flex-shrink: 0;
    }
.header .brand { color: inherit; }
    .header .theme-toggle { color: color-mix(in oklab, currentColor 70%, transparent); border-color: color-mix(in oklab, currentColor 25%, transparent); }
    .header .theme-toggle:hover { color: currentColor; border-color: color-mix(in oklab, currentColor 50%, transparent); }
    .brand {
      display: flex;
      align-items: center;
      align-self: stretch;
      font-family: var(--font-mono);
      font-size: 20px;
      font-weight: var(--fw-semibold);
      letter-spacing: -0.02em;
      color: var(--fg);
      text-decoration: none;
      background-image: none;
      padding: 0 4px;
    }
    .brand .logo { margin: 0; line-height: 1; }
    .header__nav {
      margin-left: auto;
      display: flex;
      gap: 4px;
      align-items: center;
      position: relative;
    }
    .nav-link {
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 500;
      color: var(--fg-muted);
      background-image: none;
      text-decoration: none;
      transition: color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
    }
    .nav-link:hover { color: var(--fg); background: color-mix(in oklab, currentColor 10%, transparent); }
    html[data-theme="dark"] .nav-link:hover { color: var(--neon-ice); }

    /* Hamburger menu — hidden when inline links fit */
    .menu-toggle {
      display: none;
      width: 36px;
      height: 36px;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: inherit;
      cursor: pointer;
      padding: 0;
      margin-left: 4px;
      transition: color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .menu-toggle:hover { border-color: var(--accent); }
    .menu-toggle:active { transform: scale(0.94); }
    .menu-toggle svg { width: 18px; height: 18px; display: block; }
    .menu-panel {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 4px;
      padding: 0 16px;
      max-height: 0;
      overflow: hidden;
      transition: max-height var(--dur-slow) var(--ease-out), padding var(--dur-slow) var(--ease-out);
    }
    .header[data-menu-open="true"] .menu-panel {
      max-height: 200px;
      padding: 10px 16px 14px;
    }
    .menu-panel a {
      padding: 6px 12px;
      font-size: 14px;
      border-radius: var(--radius-sm);
      color: var(--fg-muted);
      background-image: none;
      text-decoration: none;
      transition: color var(--dur-base) var(--ease-out), background var(--dur-base) var(--ease-out);
    }
    .menu-panel a:hover {
      background: color-mix(in oklab, currentColor 10%, transparent);
      color: var(--fg);
    }
    html[data-theme="dark"] .menu-panel a:hover { color: var(--neon-ice); }

    .theme-toggle {
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: var(--radius-pill);
      border: 1px solid var(--border-strong);
      background: transparent;
      color: var(--fg-muted);
      cursor: pointer;
      margin-left: 8px;
      padding: 0;
      transition: color var(--dur-base) var(--ease-out), border-color var(--dur-base) var(--ease-out), transform var(--dur-fast) var(--ease-out);
    }
    .theme-toggle:hover { color: var(--fg); border-color: var(--accent); }
    .theme-toggle:active { transform: scale(0.94); }
    .theme-toggle svg { width: 16px; height: 16px; display: block; }
    .theme-toggle .icon-sun { display: none; }
    .theme-toggle .icon-moon { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-sun { display: block; }
    html[data-theme="dark"] .theme-toggle .icon-moon { display: none; }

    @media (max-width: 600px) {
      .nav-link { display: none; }
      .menu-toggle { display: inline-flex; }
    }

    @keyframes entry {
      0% { opacity: 0; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    footer {
      position: relative;
      z-index: 1;
      border-top: 1px solid var(--border);
      padding: 32px;
      display: flex;
      align-items: center;
      gap: 24px;
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--fg-subtle);
      flex-wrap: wrap;
    }
    footer .spacer { flex: 1; }
    footer a { color: var(--fg-muted); background-image: none; }
    footer a:hover { color: var(--fg); }
